<section id="ai-search" class="py-5">

    <div class="card border-0 shadow-lg">

        <div class="card-body p-5 text-center">

            <h1 class="fw-bold mb-3">
                 ShopSmart AI Copilot
            </h1>

            <p class="lead text-muted">

                Find the perfect product using AI-powered recommendations.

            </p>

            <form
                action="{{ url_for('ai_search') }}"
                method="POST"
                class="mt-4">

                <div class="input-group input-group-lg">

                    <input
                        type="text"
                        name="query"
                        class="form-control"
                        placeholder="Example: Best laptop under ₹60,000 for programming">

                    <button
                        class="btn btn-primary">

                        <i class="bi bi-stars"></i>

                        Ask AI

                    </button>

                </div>

            </form>

            <div class="mt-4">

                <span class="badge bg-primary m-1">💻 Laptop</span>
                <span class="badge bg-success m-1">📱 Smartphone</span>
                <span class="badge bg-warning text-dark m-1">🎧 Headphones</span>
                <span class="badge bg-danger m-1">👟 Shoes</span>
                <span class="badge bg-info text-dark m-1">💄 Beauty</span>
                <span class="badge bg-secondary m-1">📚 Books</span>
                <span class="badge bg-dark m-1">⚽ Sports</span>

            </div>

        </div>

    </div>

</section>
