<div class="col-lg-3 col-md-4 col-sm-6 mb-4">

    <a
        href="{{ url_for('category', category=category.name) }}"
        class="text-decoration-none">

        <div class="card border-0 shadow-sm text-center h-100 category-card">

            <div class="card-body p-4">

                <div class="display-4">

                    {{ category.icon }}

                </div>

                <h5 class="mt-3">

                    {{ category.name }}

                </h5>

            </div>

        </div>

    </a>

</div>
