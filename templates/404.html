{% extends "base.html" %}

{% block title %}
404 | Page Not Found
{% endblock %}

{% block content %}

<div class="text-center py-5">

    <i class="bi bi-exclamation-circle display-1 text-danger"></i>

    <h1 class="mt-4">

        404

    </h1>

    <h3>

        Page Not Found

    </h3>

    <p class="text-muted">

        The page you are looking for doesn't exist.

    </p>

    <a
        href="{{ url_for('home') }}"
        class="btn btn-primary">

        Go Home

    </a>

</div>

{% endblock %}
